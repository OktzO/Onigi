name: Release curve25519 native bindings

on:
  push:
    tags:
      - 'curve25519-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# `oktz-curve25519` ships a hand-written `index.cjs` that is a thin wrapper over
# the generated `native-loader.cjs`; the loader itself is pure napi-rs output
# with no hand patches, so regenerating it per target is safe. Only the wrapper
# is hand-maintained, and no job here writes it.
#
# android-arm64 is not built here at all. It needs the Android NDK via cargo-ndk,
# which nothing in this repository sets up yet, and `napi artifacts` refuses to
# emit until every target in napi.config.json has a .node -- so leaving it in the
# config would block the four Linux packages as well. It is therefore absent
# from both napi.config.json and optionalDependencies, which keeps the package
# internally consistent: a consumer on Android installs cleanly and falls back to
# the JS path rather than waiting on a package that does not exist.
#
# Re-adding it is a deliberate piece of work, not a flag flip: set up the NDK,
# add the target back to both files, and prove the .node loads under an Android
# runtime before publishing it. `oktz-signal/.github/workflows/release.yml`
# already withholds its own android build for the same reason.

jobs:
  build:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            package: linux-x64-gnu
            command: npm exec -- napi build --release --platform --js-package-name @oktz/curve25519 --target x86_64-unknown-linux-gnu --config-path napi.config.json --manifest-path Cargo.toml --output-dir . --js native-loader.cjs -- --locked
          - target: x86_64-unknown-linux-musl
            package: linux-x64-musl
            command: npm exec -- napi build --release --platform --js-package-name @oktz/curve25519 --target x86_64-unknown-linux-musl --cross-compile --config-path napi.config.json --manifest-path Cargo.toml --output-dir . --js native-loader.cjs -- --locked
          - target: aarch64-unknown-linux-gnu
            package: linux-arm64-gnu
            command: npm exec -- napi build --release --platform --js-package-name @oktz/curve25519 --target aarch64-unknown-linux-gnu --cross-compile --config-path napi.config.json --manifest-path Cargo.toml --output-dir . --js native-loader.cjs -- --locked
          - target: aarch64-unknown-linux-musl
            package: linux-arm64-musl
            command: npm exec -- napi build --release --platform --js-package-name @oktz/curve25519 --target aarch64-unknown-linux-musl --cross-compile --config-path napi.config.json --manifest-path Cargo.toml --output-dir . --js native-loader.cjs -- --locked
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native/curve25519/package.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl
      # `--cross-compile` builds the musl targets through cargo-zigbuild, which
      # needs a real zig on PATH. `taiki-e/install-action` does not support zig
      # and falls back to cargo-binstall, which resolves zig to a crate wrapper
      # and then fails with "zig is not found" -- so install it directly.
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
      - run: npm ci
        working-directory: native/curve25519
      - run: ${{ matrix.command }}
        working-directory: native/curve25519
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: curve25519-${{ matrix.package }}
          path: native/curve25519/*.node
          if-no-files-found: error

  package:
    name: assemble the platform packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native/curve25519/package.json
      - run: npm ci
        working-directory: native/curve25519
      # `napi artifacts` refuses to run until every target configured in
      # napi.config.json has a `.node` on disk, so all of them are collected into
      # one output dir before it is invoked. The per-platform package.json
      # files it writes take their version from native/curve25519/package.json.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: curve25519-linux-x64-gnu
          path: native/curve25519
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: curve25519-linux-x64-musl
          path: native/curve25519
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: curve25519-linux-arm64-gnu
          path: native/curve25519
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: curve25519-linux-arm64-musl
          path: native/curve25519
      - name: Every configured target must be present
        run: |
          test -f curve25519.linux-x64-gnu.node
          test -f curve25519.linux-x64-musl.node
          test -f curve25519.linux-arm64-gnu.node
          test -f curve25519.linux-arm64-musl.node
          ls -l curve25519.*.node
        working-directory: native/curve25519
      - name: Confirm the hand-written wrapper is untouched
        # `index.cjs` is the only hand-maintained file in this package. No build
        # step writes it; if a future napi-rs change starts doing so, this fails
        # the publish rather than shipping an overwritten wrapper.
        run: |
          if git diff --quiet -- native/curve25519/index.cjs; then
            echo "index.cjs unmodified"
          else
            echo "::error::index.cjs was modified by a build step"
            git diff -- native/curve25519/index.cjs
            exit 1
          fi
      - run: npm exec -- napi artifacts --config-path napi.config.json --output-dir . --npm-dir npm
        working-directory: native/curve25519
      - name: Summarise what a tag push would publish
        run: |
          {
            echo "### platform packages assembled"
            echo ""
            echo "| package | version | os | cpu |"
            echo "|---|---|---|---|"
            for d in npm/*/; do
              [ -f "$d/package.json" ] || continue
              name=$(node -p "require('./$d/package.json').name")
              version=$(node -p "require('./$d/package.json').version")
              os=$(node -p "(require('./$d/package.json').os||[]).join(',')")
              cpu=$(node -p "(require('./$d/package.json').cpu||[]).join(',')")
              echo "| $name | $version | $os | $cpu |"
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: native/curve25519
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: curve25519-packages
          path: native/curve25519/npm
          if-no-files-found: error

  verify:
    name: verify on the host target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native/curve25519/package.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: npm ci
        working-directory: native/curve25519
      - name: Build the host binding for the test suite
        # index.cjs requires ./native-loader.cjs, which in turn locates the
        # .node. A --no-js build emits the .node but no loader, so the suite
        # dies with "Cannot find native binding" — build both here.
        run: npm exec -- napi build --release --platform --js-package-name @oktz/curve25519 --target x86_64-unknown-linux-gnu --config-path napi.config.json --manifest-path Cargo.toml --output-dir . --js native-loader.cjs -- --locked
        working-directory: native/curve25519
      - name: Run the suite that gates this publish
        run: npm test
        working-directory: native/curve25519
      - name: Run the doc examples
        run: npm run docs:verify
        working-directory: native/curve25519

  publish:
    needs:
      - package
      - verify
    # Publishing is irreversible, so a manual dispatch stops after `package`:
    # the cross-compile, the artifacts assembly and both test suites all run and
    # their results can be inspected, but nothing reaches the registry until a
    # `curve25519-v*` tag is pushed. That is the only thing that publishes.
    if: startsWith(github.ref, 'refs/tags/curve25519-v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: native/curve25519/package.json
      - run: npm ci
        working-directory: native/curve25519
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: curve25519-packages
          path: native/curve25519/npm
      - name: Confirm the hand-written wrapper is untouched
        # `index.cjs` is the only hand-maintained file in this package and no
        # build step writes it. If a future napi-rs change starts writing it,
        # this fails the publish rather than shipping an overwritten wrapper.
        run: |
          if git diff --quiet -- native/curve25519/index.cjs; then
            echo "index.cjs unmodified"
          else
            echo "::error::index.cjs was modified by a build step"
            git diff -- native/curve25519/index.cjs
            exit 1
          fi
      - name: Verify publish tarballs
        run: |
          npm pack --dry-run
          for d in npm/*/; do
            echo "--- $d"
            (cd "$d" && npm pack --dry-run)
          done
        working-directory: native/curve25519
      - name: Dry-run every package with the exact publish flags
        # The first four attempts each failed on something only the real publish
        # would have revealed: a missing secret, a directory argument treated as
        # a package name, and a missing --access. A dry-run with identical flags
        # catches all three, and it is the only step that can run before any
        # irreversible action.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --dry-run --ignore-scripts --provenance --access public
          for d in npm/*/; do
            (cd "$d" && npm publish --dry-run --ignore-scripts --provenance --access public)
          done
        working-directory: native/curve25519
      - name: Publish Linux platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # `npm publish <dir>` treats <dir> as a package NAME, not a folder --
          # it resolved npm/linux-x64-gnu as an unscoped package and tried
          # git@github.com/npm/linux-x64-gnu.git. cd into each directory so
          # npm reads the package.json sitting in it.
          for d in npm/*/; do
            (cd "$d" && npm publish --ignore-scripts --provenance --access public)
          done
        working-directory: native/curve25519
      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --provenance --access public
        working-directory: native/curve25519