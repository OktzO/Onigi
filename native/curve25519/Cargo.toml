[package]
name = "curve25519-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.2", features = ["full"] }
napi-derive = "3.6.3"
curve25519-dalek = { version = "4", features = ["zeroize"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

[build-dependencies]
napi-build = "2.4.1"

[profile.release]
lto = true
strip = "symbols"
