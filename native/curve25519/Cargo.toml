[package]
name = "curve25519-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.2", features = ["full"] }
napi-derive = "3.6.3"
curve25519-dalek = "4"
sha2 = "0.10"

[build-dependencies]
napi-build = "2.4.1"

[profile.release]
lto = true
strip = "symbols"
